name: "vprofile actions"
on: workflow_dispatch
env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: vprofileappimg
  EKS_CLUSTER: vprofile-eks

jobs:
    Testing:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Maven Test
              run: mvn test

            - name: Checkstyle
              run: mvn checkstyle:checkstyle


            - name: Setup Java 11 for SonarQube
              uses: actions/setup-java@v3
              with:
                distribution: 'temurin'
                java-version: '11'


            - name: Setup SonarQube Scanner
              uses: warchant/setup-sonar-scanner@v1
              with:
                sonar-scanner-version: '4.8.0.2856'
                sonar-scanner-home: ${{ github.workspace }}/sonar-scanner

            - name: SonarQube Scan
              run: sonar-scanner
                 -Dsonar.host.url=${{secrets.SONAR_URL}}
                 -Dsonar.login=${{secrets.SONAR_TOKEN}}
                 -Dsonar.projectKey=${{secrets.SONAR_PROJECT_KEY}}
                 -Dsonar.organization=${{secrets.SONAR_ORGANIZATION}}
                 -Dsonar.sources=src/
                 -Dsonar.junit.reportsPath=target/surefire-reports/
                 -Dsonar.jacoco.reportPaths=target/jacoco.exec
                 -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
                 -Dsonar.java.binaries=target/test-classes/com/visualpathit/accounts


            - name: SonarQube Quality Gate Check
              id: sonarQubeQualityCheck
              uses: sonarsource/sonarcloud-quality-gate-action@master
              timeout-minutes: 5
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

            
